name: Daily Job Digest Bot

on:
  schedule:
    # 02:30 UTC is exactly 08:00 AM IST
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy pandas feedparser

      - name: Run Multi-Portal Job Scraper & Send Email
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python fetch_jobs.py

      - name: Commit and push daily file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs_*.md
          git commit -m "Auto-generated daily RPA/AI digest [skip ci]" || echo "No changes to commit"
          git push
